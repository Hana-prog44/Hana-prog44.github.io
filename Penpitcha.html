<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Abot Penpitcha</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.7;
      margin: 40px;
      max-width: 700px;
      color: #222;
      text-align: left;
    }

    /* ===== หัวข้อใหญ่ ===== */
    h1 {
      color: #a600ff;
      font-size: 28px;
      margin-bottom: 20px;
    }

    /* ===== กล่องโพลารอยด์ ===== */
    .polaroid {
      margin-top: 20px;
      text-align: left;
    }

    .polaroid img {
      width: 250px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* ===== ข้อความใต้รูป ===== */
    .caption {
      font-weight: bold;
      margin-top: 10px;
    }
    .subcaption {
      color: #555;
      font-size: 14px;
    }

    /* ===== แถบ highlight ===== */
    .highlight-bar {
      margin: 20px 0;
      padding: 12px 12px;
      background: linear-gradient(to right, #4f008b, #eb10ff);
      color: #fff;
      font-weight: bold;
    }

    /* ===== เนื้อหาข้อความ ===== */
    .content {
      margin: 20px 0;
    }

    a {
      color: rgb(248, 30, 30);
      text-decoration: underline;
    }

        /* ===== รูปด้านล่าง ===== */
    .bottom-img {
      margin-top: 20px;
      text-align: left;
    }
    .bottom-img img {    {
      

    }    {
      "configurations": [
        {
          "type": "node",
          "request": "launch",
          "name": "Launch Program",
          "program": "${workspaceFolder}/${input:programPath}"
        }
      ],
      "inputs": [
        {
          "type": "promptString",
          "id": "programPath",
          "description": "Enter the relative path to the program you want to debug (e.g., app.js, main.py, etc.)"
        }
      ]
    }    
      width: 250px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

  </style>
</head>
<body>

  <!-- หัวข้อ -->
  <h1>แนะนำตัว</h1>

  <!-- โพลารอยด์ -->
  <div class="polaroid">
    <img src="https://scontent.fbkk4-2.fna.fbcdn.net/v/t1.15752-9/553117499_763949299850690_3774032810368493208_n.jpg?stp=dst-jpg_p480x480_tt6&_nc_cat=101&ccb=1-7&_nc_sid=0024fc&_nc_ohc=1BTDYcoJIS4Q7kNvwFS6pE4&_nc_oc=AdmsACq9yps_yFVWaT-WSrTVG93qajfE4r5j_3VaWD1ocydMNnCkqalmFlQGl8ZwyQY&_nc_ad=z-m&_nc_cid=1483&_nc_zt=23&_nc_ht=scontent.fbkk4-2.fna&oh=03_Q7cD3gEQjXs-zVS4YTXdD3ccE3OJIicKE_mLBL64BOVjxQWIFw&oe=69098D40" alt="โพลารอยด์">
  </div>

  <!-- ข้อความใต้รูป -->
  <div class="caption">นางสาวเพ็ญพิชชา พัฒนกิจ</div>
  <div class="subcaption">ชอบตัวละครฮันเตอร์จากเกม Identity v</div>

  <!-- แถบ highlight -->
  <div class="highlight-bar">
  </div>

  <!-- เนื้อหา -->
  <div class="content">
    สวัสดีค่ะ ชื่อ เพ็ญพิชชา ชื่อเล่น โอปอล์ สาขาDIT เซคอ บ่าย<br><br>
   หาความรู้ไปใช้ในอนาคต<br>
    คาดหวังว่า<br>
    จุดอ่อนคือ<br><br>

    <div class="caption">ตัวละครในเกมที่ชอบมากๆ</div>

    <a href="https://id5.fandom.com/wiki/Wu_Chang">fandom wikipedia</a>
  </div>

   <!-- รูปด้านล่าง -->
  <div class="bottom-img">
    <img src="https://instagram.fbkk4-1.fna.fbcdn.net/v/t1.15752-9/525453945_1445681776668659_1053612746620856987_n.png?stp=dst-png_p480x480&_nc_cat=111&ccb=1-7&_nc_sid=0024fc&_nc_ohc=NFo6TTEsu7QQ7kNvwEO7ag2&_nc_oc=AdmVigJYkH-aleFl20PCBdTRqx6K5hqSg7tKCeb7OIR04DYpliF-Vn0oYbovL48SJdQ&_nc_zt=23&_nc_ht=instagram.fbkk4-1.fna&oh=03_Q7cD3gE-g2fxcJnkis4IUKU8OCD9E_kMwxktrnH8j-hhyW2TpQ&oe=69097B03" alt="ตัวละครในอนิเมะ">
  </div>

</body>
</html>
